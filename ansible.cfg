[defaults]
# First entry is the galaxy install target, so third-party collections cannot
# overwrite tekne.common, tekne.personal, or tekne.work.
collections_path = ./.ansible/collections:./collections
retry_files_enabled = False
host_key_checking = True
timeout = 30
remote_user = devops
display_args_to_stdout = False
interpreter_python = auto_silent

# There is no default inventory. Pass -i inventories/personal or -i inventories/work.
stdout_callback = default
result_format = yaml
callbacks_enabled = profile_tasks
bin_ansible_callbacks = True

[inventory]
# A wrong host pattern fails the run instead of succeeding on zero hosts.
host_pattern_mismatch = error
