---
argument_specs:
  main:
    short_description: Steam, Lutris, Wine, gamemode, and gaming host limits
    description:
      - Installs Steam, Lutris, Wine, and gamemode on gaming hosts.
    options:
      gaming_packages:
        description: Gaming packages to install.
        required: false
        type: list
        elements: str
        default:
          - lutris
          - steam
          - lib32-systemd
          - wine-tkg-valve-exp-bleeding
          - winetricks
          - wine-gecko
          - wine-mono
          - openbox
          - gamemode
          - lib32-gamemode
          - proton-ge-custom-bin
          - noto-fonts-cjk
          - mangohud
          - lib32-mangohud
          - gamescope
      gaming_environment:
        description: Variables written to /etc/environment and /etc/profile.d for gaming hosts.
        required: false
        type: list
        elements: dict
        default:
          - { key: WINEFSYNC, value: "1" }
          - { key: WINEESYNC, value: "1" }
          - { key: WINENTSYNC, value: "1" }
          - { key: PROTON_ENABLE_NVAPI, value: "1" }
          - { key: __GL_SHADER_DISK_CACHE, value: "1" }
          - { key: __GL_SHADER_DISK_CACHE_SKIP_CLEANUP, value: "1" }
          - { key: __GL_SHADER_DISK_CACHE_SIZE, value: "10737418240" }
      gaming_hosts:
        description: Hostnames that receive gaming packages and limits.
        required: false
        type: list
        elements: str
        default: []
      gaming_xorg_hosts:
        description: Hostnames that receive the NVIDIA game-session Xorg config.
        required: false
        type: list
        elements: str
        default: []
      gaming_library_path:
        description: Mount point of the dedicated game library.
        required: false
        type: str
        default: /mnt/games
      gaming_library_hosts:
        description: Hostnames whose game library is group-writable by games.
        required: false
        type: list
        elements: str
        default: []
      gaming_xorg_conf_dest:
        description: NVIDIA game-session Xorg config. The game script passes this path to -xf86config.
        required: false
        type: str
        default: /etc/X11/yugen-game.conf
      gaming_xorg_conf_legacy_dest:
        description: Previous drop-in path. Removed so the desktop session is not pinned to one output.
        required: false
        type: str
        default: /etc/X11/xorg.conf.d/20-yugen-nvidia.conf
      gaming_limits_conf_dest:
        description: The limits conf dest value for the gaming role.
        required: false
        type: str
        default: /etc/security/limits.d/gaming.conf
      gaming_script_dest:
        description: The script dest value for the gaming role.
        required: false
        type: str
        default: /usr/local/bin/game
      gaming_schedtoold_conf_dest:
        description: The schedtoold conf dest value for the gaming role.
        required: false
        type: str
        default: /etc/schedtoold.conf
      gaming_gamemode_ini_dest:
        description: The gamemode ini dest value for the gaming role.
        required: false
        type: str
        default: /etc/gamemode.ini
      gaming_gamemode_users:
        description: The gamemode users value for the gaming role.
        required: false
        type: list
        elements: str
        default:
          - dvaliente
          - devops
