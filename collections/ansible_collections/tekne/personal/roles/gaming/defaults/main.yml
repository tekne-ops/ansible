---
# defaults file for ./ansible-role-gaming

# Gaming packages to install
gaming_packages:
  - lutris
  - steam
  - lib32-systemd
  - wine-tkg-valve-exp-bleeding
  - winetricks
  - wine-gecko
  - wine-mono
  - openbox
  - gamemode
  - lib32-gamemode
  - proton-ge-custom-bin
  - noto-fonts-cjk
  - mangohud
  - lib32-mangohud
  - gamescope
  # - lib32-pcsclite

# Login and desktop sessions. LightDM reads /etc/environment. Login shells
# also source /etc/profile.d/gaming-performance.sh. ~/.bashrc is not enough:
# a desktop launcher never reads it, and OneDrive replaces that file.
gaming_environment:
  - { key: WINEFSYNC, value: "1" }
  - { key: WINEESYNC, value: "1" }
  - { key: WINENTSYNC, value: "1" }
  - { key: PROTON_ENABLE_NVAPI, value: "1" }
  - { key: __GL_SHADER_DISK_CACHE, value: "1" }
  - { key: __GL_SHADER_DISK_CACHE_SKIP_CLEANUP, value: "1" }
  - { key: __GL_SHADER_DISK_CACHE_SIZE, value: "10737418240" }

# Hostnames that receive gaming packages, limits, schedtoold, gamemode.
# Membership comes from inventories/personal/host_vars.
gaming_hosts: []

# NVIDIA game-session Xorg config. Membership comes from inventories/personal/host_vars.
gaming_xorg_hosts: []

# Dedicated game-library mount. Membership comes from inventories/personal/host_vars.
gaming_library_path: /mnt/games
gaming_library_hosts: []

# File destinations. The game config stays out of xorg.conf.d.
gaming_xorg_conf_dest: /etc/X11/yugen-game.conf
gaming_xorg_conf_legacy_dest: /etc/X11/xorg.conf.d/20-yugen-nvidia.conf
gaming_limits_conf_dest: /etc/security/limits.d/gaming.conf
gaming_script_dest: /usr/local/bin/game
gaming_schedtoold_conf_dest: /etc/schedtoold.conf
gaming_gamemode_ini_dest: /etc/gamemode.ini
gaming_gamemode_users:
  - dvaliente
  - devops
