---
# Compatibility dispatcher. ASTER, YUGEN, and KVM run workstation roles.
# THEMIS runs server roles.
#
#   ansible-playbook playbooks/personal/main.yml -i inventories/personal/hosts.yml --ask-vault-pass
#   ansible-playbook playbooks/personal/main.yml -i inventories/personal/hosts.yml --tags kde

- name: Dispatch host configuration
  hosts: localhost
  connection: local
  become: true

  vars:
    tekne_allowed_hostnames:
      - ASTER
      - YUGEN
      - KVM
      - THEMIS

  pre_tasks:
    - name: Assert the personal inventory context
      ansible.builtin.assert:
        that:
          - tekne_context == "personal"
        fail_msg: playbooks/personal/main.yml requires inventories/personal (tekne_context=personal).
      tags: [always]

    - name: Assert the host profile
      ansible.builtin.import_tasks: tasks/hostname.yml

  tasks:
    - name: Apply workstation roles
      ansible.builtin.import_tasks: tasks/workstation_roles.yml
      when: current_hostname != 'THEMIS'

    - name: Apply server roles
      ansible.builtin.import_tasks: tasks/server_roles.yml
      when: current_hostname == 'THEMIS'
