---
# Workstation entrypoint for ASTER, YUGEN, and KVM.
#
#   ansible-playbook playbooks/personal/workstation.yml -i inventories/personal/hosts.yml --ask-vault-pass
#   ansible-playbook playbooks/personal/workstation.yml -i inventories/personal/hosts.yml --tags kde

- name: Configure workstation
  hosts: workstations
  connection: local
  become: true

  vars:
    tekne_allowed_hostnames:
      - ASTER
      - YUGEN
      - KVM

  pre_tasks:
    - name: Assert the personal inventory context
      ansible.builtin.assert:
        that:
          - tekne_context == "personal"
        fail_msg: playbooks/personal/workstation.yml requires inventories/personal (tekne_context=personal).
      tags: [always]

    - name: Assert the workstation host profile
      ansible.builtin.import_tasks: tasks/hostname.yml

  tasks:
    - name: Apply workstation roles
      ansible.builtin.import_tasks: tasks/workstation_roles.yml
