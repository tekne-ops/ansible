---
# Personal inventory. Always pass -i inventories/personal/hosts.yml.
# Plays target localhost. Host profiles are loaded from host_vars/<HOSTNAME>.yml
# after /etc/hostname is read, so one local connection does not apply every profile.
all:
  children:
    workstations:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
    servers:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
